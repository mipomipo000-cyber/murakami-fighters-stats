<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>村上ファイターズ 成績管理</title>
<style>
:root{--orange:#f58220;--green:#16834a;--navy:#14243a}*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18212b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
header{background:var(--navy);color:white;padding:20px 16px;text-align:center;border-bottom:5px solid var(--orange)}header h1{font-size:22px;margin:0}header p{margin:6px 0 0;font-size:12px;opacity:.85}
nav{display:flex;overflow:auto;background:white;position:sticky;top:0;z-index:2;border-bottom:1px solid #ddd}nav button{flex:1;min-width:76px;border:0;background:white;padding:13px 6px;font-weight:700;color:#455; font-size:13px}nav button.active{color:var(--green);border-bottom:3px solid var(--orange)}
main{padding:14px;max-width:760px;margin:auto}.panel{background:white;border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 2px 8px #0000000a}.panel h2{font-size:18px;margin:0 0 14px;color:var(--navy)}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:11px;border:1px solid #cbd2d9;border-radius:8px;font-size:16px;background:white} .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:0;border-radius:9px;padding:12px 15px;background:var(--green);color:white;font-weight:700;font-size:15px;width:100%;margin-top:12px}.btn.secondary{background:#e9eef2;color:#243447}.btn.orange{background:var(--orange)}.hidden{display:none}.muted{color:#687584;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f0f5f2;padding:12px;border-radius:10px;text-align:center}.stat b{font-size:22px;display:block;color:var(--green)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid #e5e9ed;text-align:center}th{background:#f2f5f7} .scroll{overflow:auto}.playerrow{display:flex;gap:8px;align-items:center;margin:8px 0}.playerrow input{flex:1}.playerrow button{border:0;background:#fee;color:#a22;border-radius:8px;padding:10px}
</style></head><body>
<header><h1>⚾ 村上ファイターズ</h1><p>試合成績・個人成績管理アプリ</p></header>
<nav><button class="active" onclick="tab('game',this)">試合入力</button><button onclick="tab('players',this)">選手登録</button><button onclick="tab('games',this)">試合一覧</button><button onclick="tab('annual',this)">年間成績</button><button onclick="tab('print',this)">印刷/PDF</button></nav>
<main>
<section id="game">
<div class="panel"><h2>試合情報</h2><div class="grid"><div><label>日付</label><input id="date" type="date"></div><div><label>対戦相手</label><input id="opponent" placeholder="例：○○ボーイズ"></div><div><label>自チーム得点</label><input id="runs" type="number" min="0" value="0"></div><div><label>相手得点</label><input id="oppRuns" type="number" min="0" value="0"></div></div><label>メモ</label><input id="memo" placeholder="大会名・球場など"></div>
<div class="panel"><h2>選手別成績入力</h2><label>選手</label><select id="batter"></select><div class="grid"><div><label>打数</label><input id="ab" type="number" min="0" value="0"></div><div><label>安打</label><input id="hits" type="number" min="0" value="0"></div><div><label>打点</label><input id="rbi" type="number" min="0" value="0"></div><div><label>本塁打</label><input id="hr" type="number" min="0" value="0"></div><div><label>四球</label><input id="bb" type="number" min="0" value="0"></div><div><label>死球</label><input id="hbp" type="number" min="0" value="0"></div><div><label>犠打</label><input id="sac" type="number" min="0" value="0"></div><div><label>犠飛</label><input id="sf" type="number" min="0" value="0"></div><div><label>盗塁</label><input id="sb" type="number" min="0" value="0"></div></div><button class="btn secondary" onclick="addLine()">この選手の成績を追加</button><div id="lines"></div>
<hr><h3>投手成績（任意）</h3><label>投手</label><select id="pitcher"></select><div class="grid"><div><label>投球アウト数</label><input id="outs" type="number" value="0" min="0"></div><div><label>自責点</label><input id="er" type="number" value="0" min="0"></div><div><label>奪三振</label><input id="so" type="number" value="0" min="0"></div><div><label>四球</label><input id="pbb" type="number" value="0" min="0"></div></div><button class="btn" onclick="saveGame()">試合を保存</button></div></section>
<section id="players" class="hidden"><div class="panel"><h2>選手登録（年度ごと）</h2><label>年度</label><input id="year" type="number" value="2026"><label>選手名</label><input id="newPlayer" placeholder="選手名"><button class="btn" onclick="addPlayer()">選手を登録</button><div id="playerList"></div></div></section>
<section id="games" class="hidden"><div class="panel"><h2>試合一覧</h2><div id="gameList"></div></div></section>
<section id="annual" class="hidden"><div class="panel"><h2>年間成績</h2><label>年度</label><input id="annualYear" type="number" value="2026" onchange="renderAnnual()"><div id="annualData"></div></div></section>
<section id="print" class="hidden"><div class="panel"><h2>印刷・PDF</h2><p>年間成績を表示した状態で、下のボタンから印刷またはPDF保存できます。</p><button class="btn" onclick="tab('annual',document.querySelectorAll('nav button')[3]);window.print()">印刷 / PDF保存</button><button class="btn secondary" onclick="backup()">データをバックアップ</button><label>バックアップファイルを読み込む</label><input type="file" accept=".json" onchange="restore(event)"><p class="muted">データはこのiPhoneのブラウザ内に保存されます。機種変更・ブラウザ削除前にバックアップしてください。</p></div></section>
</main>
<script>
let db=JSON.parse(localStorage.getItem('mfstats')||'{"players":{},"games":[]}'),entry=[];
function persist(){localStorage.setItem('mfstats',JSON.stringify(db));refresh()}
function tab(id,b){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');refresh()}
function yearNow(){return Number(document.getElementById('year')?.value||2026)}
function refresh(){let y=yearNow(),p=db.players[y]||[];['batter','pitcher'].forEach(id=>{let el=document.getElementById(id);if(el)el.innerHTML=p.map(n=>`<option>${esc(n)}</option>`).join('')||'<option>選手未登録</option>'});let pl=document.getElementById('playerList');if(pl)pl.innerHTML=p.map(n=>`<div class="playerrow">${esc(n)}<button onclick="delPlayer('${encodeURIComponent(n)}')">削除</button></div>`).join('');renderGames();renderAnnual()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addPlayer(){let y=yearNow(),n=document.getElementById('newPlayer').value.trim();if(!n)return;db.players[y]??=[];if(!db.players[y].includes(n))db.players[y].push(n);document.getElementById('newPlayer').value='';persist()}
function delPlayer(n){let y=yearNow();db.players[y]=(db.players[y]||[]).filter(x=>x!==decodeURIComponent(n));persist()}
function addLine(){let name=document.getElementById('batter').value;if(!name||name==='選手未登録')return alert('先に選手登録してください');let x={name};['ab','hits','rbi','hr','bb','hbp','sac','sf','sb'].forEach(k=>x[k]=+document.getElementById(k).value||0);entry.push(x);document.getElementById('lines').innerHTML=entry.map(a=>`<p>・${esc(a.name)}：${a.hits}/${a.ab}安打、打点${a.rbi}</p>`).join('');}
function saveGame(){if(!document.getElementById('date').value||!document.getElementById('opponent').value)return alert('日付と対戦相手を入力してください');let g={id:Date.now(),year:+document.getElementById('date').value.slice(0,4),date:document.getElementById('date').value,opponent:document.getElementById('opponent').value,runs:+runs.value,oppRuns:+oppRuns.value,memo:memo.value,bat:entry,pitch:{name:pitcher.value,outs:+outs.value,er:+er.value,so:+so.value,bb:+pbb.value}};db.games.push(g);entry=[];lines.innerHTML='';persist();alert('試合を保存しました！')}
function renderGames(){let el=document.getElementById('gameList');if(!el)return;el.innerHTML=db.games.slice().reverse().map(g=>`<p><b>${g.date} ${esc(g.opponent)}</b>　${g.runs}－${g.oppRuns}<button onclick="delGame(${g.id})" style="float:right">削除</button></p>`).join('')||'まだ試合がありません'}
function delGame(id){if(confirm('この試合を削除しますか？')){db.games=db.games.filter(g=>g.id!==id);persist()}}
function renderAnnual(){let el=document.getElementById('annualData');if(!el)return;let y=+(document.getElementById('annualYear')?.value||2026),gs=db.games.filter(g=>g.year===y),wins=gs.filter(g=>g.runs>g.oppRuns).length;let players=db.players[y]||[];let rows=players.map(n=>{let a=gs.flatMap(g=>g.bat||[]).filter(x=>x.name===n),sum=k=>a.reduce((s,x)=>s+(x[k]||0),0),ab=sum('ab'),h=sum('hits');return {n,ab,h,avg:ab?(h/ab).toFixed(3).replace(/^0/,''):'.000',rbi:sum('rbi'),hr:sum('hr'),sb:sum('sb')}}).sort((a,b)=>b.h-a.h);el.innerHTML=`<div class="stats"><div class="stat"><b>${gs.length}</b>試合</div><div class="stat"><b>${wins}</b>勝</div><div class="stat"><b>${gs.length-wins}</b>敗/分</div></div><div class="scroll"><table><tr><th>選手</th><th>打数</th><th>安打</th><th>打率</th><th>打点</th><th>HR</th><th>盗塁</th></tr>${rows.map(r=>`<tr><td>${esc(r.n)}</td><td>${r.ab}</td><td>${r.h}</td><td>${r.avg}</td><td>${r.rbi}</td><td>${r.hr}</td><td>${r.sb}</td></tr>`).join('')}</table></div>`}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='murakami-fighters-backup.json';a.click();URL.revokeObjectURL(u)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);persist();alert('復元しました')}catch{alert('ファイルを読み込めません')}};r.readAsText(f)}
date.value=new Date().toISOString().slice(0,10);refresh();
</script></body></html>
